name: Homelab Release Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Paperless-ngx Version
        id: paperless
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/paperless-ngx/paperless-ngx/releases/latest --jq '.tag_name')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Authelia Version
        id: authelia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/authelia/authelia/releases/latest --jq '.tag_name')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Ollama Version
        id: ollama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/ollama/ollama/releases/latest --jq '.tag_name')
          echo "ver=$VERSION" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🔍 **Aktuelle Homelab Versionen:**
            
            📄 **Paperless-ngx:** `${{ steps.paperless.outputs.ver }}`
            🔒 **Authelia:** `${{ steps.authelia.outputs.ver }}`
            🧠 **Ollama:** `${{ steps.ollama.outputs.ver }}`
            
            _Das System prüft alle 6 Stunden auf Updates._
