name: Homelab Release Feed

on:
  schedule:
    - cron: '0 6 * * *' # Täglich um 06:00 Uhr
  workflow_dispatch: # Ermöglicht manuellen Start

jobs:
  check-releases:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check Versions and Notify
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Ermöglicht die Nutzung von gh api ohne Rate-Limits
      run: |
        # Datei für alte Versionen erstellen, falls sie nicht existiert
        touch old_versions.txt

        # Array der Standard-Releases (ID;Repository)
        RELEASES=(
          "homeassistant;home-assistant/core"
          "portainer;portainer/portainer"
          "uptime-kuma;louislam/uptime-kuma"
          "nodered;node-red/node-red"
          "frigate;blakeblackshear/frigate"
          "plex;plexinc/pms-docker"
          "tautulli;Tautulli/Tautulli"
          "jellyfin;jellyfin/jellyfin"
          "nextcloud;nextcloud/server"
          "adguard;AdguardTeam/AdGuardHome"
          "vaultwarden;dani-garcia/vaultwarden"
          "promtail;grafana/loki"
          "loki;grafana/loki"
          "grafana;grafana/grafana"
          "prometheus;prometheus/prometheus"
          "zigbee2mqtt;Koenkk/zigbee2mqtt"
          "mediainfo;jlesage/docker-mediainfo"
          "jdownloader;jlesage/docker-jdownloader-2"
          "mkvtoolnix;jlesage/docker-mkvtoolnix"
          "backrest;garethgeorge/backrest"
          "redis;redis/redis"
          "gotenberg;gotenberg/gotenberg"
        )

        # Array für Git-Tags-Releases (ID;Repository)
        TAGS=(
          "mosquitto;eclipse-mosquitto/mosquitto"
          "postgres;postgres/postgres"
          "tika;apache/tika"
        )

        MESSAGE="🔔 *Homelab Update Feed* 🔔%0A%0A"
        UPDATES_FOUND=false

        # 1. Standard-Releases verarbeiten
        for item in "${RELEASES[@]}"; do
          IFS=";" read -r ID REPO <<< "$item"
          
          # gh api nutzen, um Rate-Limits zu umgehen und Fehler sauber abzufangen
          NEW_VER=$(gh api repos/$REPO/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          
          if [ -n "$NEW_VER" ] && [ "$NEW_VER" != "null" ]; then
            OLD_VER=$(grep "^$ID=" old_versions.txt | cut -d'=' -f2)
            
            if [ "$OLD_VER" != "$NEW_VER" ]; then
              UPDATES_FOUND=true
              if [ -n "$OLD_VER" ]; then
                MESSAGE+="- *$ID*: \`$OLD_VER\` ➡️ \`$NEW_VER\` 🆕%0A"
              else
                MESSAGE+="- *$ID*: Initial erfasst \`$NEW_VER\`%0A"
              fi
              sed -i "/^$ID=/d" old_versions.txt
              echo "$ID=$NEW_VER" >> old_versions.txt
            fi
          fi
        done

        # 2. Git-Tags-Releases verarbeiten
        for item in "${TAGS[@]}"; do
          IFS=";" read -r ID REPO <<< "$item"
          
          # Holt das erste Element aus dem Array und extrahiert den Namen fehlerfrei
          NEW_VER=$(gh api repos/$REPO/tags --jq '.[0].name' 2>/dev/null || echo "")
          
          if [ -n "$NEW_VER" ] && [ "$NEW_VER" != "null" ]; then
            OLD_VER=$(grep "^$ID=" old_versions.txt | cut -d'=' -f2)
            
            if [ "$OLD_VER" != "$NEW_VER" ]; then
              UPDATES_FOUND=true
              if [ -n "$OLD_VER" ]; then
                MESSAGE+="- *$ID*: \`$OLD_VER\` ➡️ \`$NEW_VER\` 🆕%0A"
              else
                MESSAGE+="- *$ID*: Initial erfasst \`$NEW_VER\`%0A"
              fi
              sed -i "/^$ID=/d" old_versions.txt
              echo "$ID=$NEW_VER" >> old_versions.txt
            fi
          fi
        done

        # 3. Wenn Updates gefunden wurden, Nachricht senden
        if [ "$UPDATES_FOUND" = true ]; then
          curl -s -X POST "https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
        fi

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add old_versions.txt
        if ! git diff --cached --quiet; then
          git commit -m "chore: update tracked application versions [skip ci]"
          git push
        fi
