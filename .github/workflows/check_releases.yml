name: Homelab Release Feed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # Ermöglicht das Speichern der Versionen im Repo

jobs:
  check-releases:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        app:
          - { id: "paperless", name: "📄 Paperless-ngx", repo: "paperless-ngx/paperless-ngx", custom_jq: ".tag_name" }
          - { id: "authelia", name: "🔒 Authelia", repo: "authelia/authelia", custom_jq: ".tag_name" }
          - { id: "ollama", name: "🧠 Ollama", repo: "ollama/ollama", custom_jq: ".tag_name" }
          - { id: "adguard", name: "🛡️ AdGuard Home", repo: "AdguardTeam/AdGuardHome", custom_jq: ".tag_name" }
          - { id: "beszel", name: "📊 Beszel", repo: "henrygd/beszel", custom_jq: ".tag_name" }
          - { id: "dockge", name: "🐳 Dockge", repo: "louislam/dockge", custom_jq: ".tag_name" }
          - { id: "filebrowser", name: "📂 Filebrowser", repo: "gtsteffaniak/filebrowser", custom_jq: ".tag_name" }
          - { id: "jellyfin", name: "🎬 Jellyfin", repo: "jellyfin/jellyfin", custom_jq: ".[] | select(.prerelease == false and .tag_name != \"v10.11.11\") | .tag_name", use_releases_list: true }
          - { id: "npm", name: "🌐 Nginx Proxy Manager", repo: "NginxProxyManager/nginx-proxy-manager", custom_jq: ".tag_name" }
          - { id: "uptime", name: "📈 Uptime-Kuma", repo: "louislam/uptime-kuma", custom_jq: ".tag_name" }
          - { id: "vaultwarden", name: "🔑 Vaultwarden", repo: "dani-garcia/vaultwarden", custom_jq: ".tag_name" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Compare Version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Version abrufen
          endpoint="releases/latest"
          if [ "${{ matrix.app.use_releases_list }}" = "true" ]; then
            endpoint="releases"
          fi
          
          V=$(gh api "repos/${{ matrix.app.repo }}/$endpoint" --jq '${{ matrix.app.custom_jq }}' 2>/dev/null | head -n 1)
          if [ -z "$V" ]; then V="Fehler"; fi
          
          # 2. Mit altem Zustand vergleichen
          touch old_versions.txt
          OLD=$(grep "^${{ matrix.app.id }}:" old_versions.txt | cut -d':' -f2)
          
          TEXT=""
          if [ -n "$OLD" ] && [ "$OLD" != "$V" ] && [ "$V" != "Fehler" ] && [ "$OLD" != "Fehler" ]; then
            TEXT=" (alt: $OLD) 🆕"
          fi
          
          # 3. Temporäre Ergebnisse für diese App speichern
          mkdir -p results
          echo "${{ matrix.app.id }}:${V}" > results/${{ matrix.app.id }}.txt
          echo "${matrix.app.name}: \`${V}\`${TEXT}" > results/${{ matrix.app.id }}_msg.txt

      # Zwischenschritt zum Sammeln aller Matrix-Ergebnisse
      - name: Upload temporary results
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.app.id }}
          path: results/
          retention-days: 1

  notify-and-save:
    needs: check-releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: res-*
          path: results
          merge-multiple: true

      - name: Process results and Build Message
        run: |
          touch old_versions.txt
          echo "🔍 *Aktuelle Homelab Versionen:*" > telegram_msg.txt
          echo "" >> telegram_msg.txt
          
          # Alphabetisch oder nach ID zusammenführen
          cat results/*_msg.txt >> telegram_msg.txt
          
          echo "" >> telegram_msg.txt
          echo "_Das System prüft alle 24 Stunden auf Updates._" >> telegram_msg.txt
          
          # Neue Versionsdatei für das Repo bauen
          cat results/*.txt | grep -v "_msg" > old_versions.txt

      - name: Save versions to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add old_versions.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stored versions [skip ci]" && git push)

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          document: telegram_msg.txt # Nutzt die generierte Datei als Nachrichtentext
